name: Sta Build

on:
  push:
    branches:
      - sta
  workflow_dispatch:
    inputs:
      build_number:
        description: "发版构建号（versionName 里 sta-asN 的 N）。留空则用 GitHub run number —— 日常验证构建走这条。"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单测与打包拆成两个并行 job。原先串行时墙钟要付两套变体的编译
  # （debug 与 release 各约 110s）再加上 R8（约 100s）；拆开后总时长
  # 由较慢的一侧决定，而不是两者相加。
  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      # release 变体没有单测任务（minify 变体不产出 UnitTest 任务），
      # 所以单测固定跑 debug 变体，与下面的打包 job 并行执行。
      - name: 运行关键单测
        run: |
          ./gradlew --no-daemon --build-cache -PstaBuildNumber="${{ github.run_number }}" \
            :app:testDebugUnitTest

  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      # 没有配置发布证书的仓库（例如 fork）不应当中断构建：
      # 记下签名是否可用，本次只产出 Debug 包。
      - name: 检查发布证书
        id: signing
        env:
          STA_RELEASE_KEYSTORE_BASE64: ${{ secrets.STA_RELEASE_KEYSTORE_BASE64 }}
          STA_RELEASE_STORE_PASSWORD: ${{ secrets.STA_RELEASE_STORE_PASSWORD }}
          STA_RELEASE_KEY_ALIAS: ${{ secrets.STA_RELEASE_KEY_ALIAS }}
          STA_RELEASE_KEY_PASSWORD: ${{ secrets.STA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$STA_RELEASE_KEYSTORE_BASE64" ||
                -z "$STA_RELEASE_STORE_PASSWORD" ||
                -z "$STA_RELEASE_KEY_ALIAS" ||
                -z "$STA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::warning::未配置 Release 签名 Secrets，本次只构建 Debug 包。"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$STA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/sta-release.jks"
          echo "available=true" >> "$GITHUB_OUTPUT"

      # 只构建要发布的那一个变体；debug 包不再构建与上传（少付一次
      # packageDebug 与 87MB 的 artifact）。
      - name: 构建 Release APK
        env:
          STA_RELEASE_STORE_FILE: ${{ runner.temp }}/sta-release.jks
          STA_RELEASE_STORE_PASSWORD: ${{ secrets.STA_RELEASE_STORE_PASSWORD }}
          STA_RELEASE_KEY_ALIAS: ${{ secrets.STA_RELEASE_KEY_ALIAS }}
          STA_RELEASE_KEY_PASSWORD: ${{ secrets.STA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ "${{ steps.signing.outputs.available }}" == "true" ]]; then
            ./gradlew --no-daemon --build-cache -PstaBuildNumber="${{ github.event.inputs.build_number || github.run_number }}" :app:assembleRelease
          else
            ./gradlew --no-daemon --build-cache -PstaBuildNumber="${{ github.event.inputs.build_number || github.run_number }}" :app:assembleDebug
          fi

      - name: 验证并整理 APK
        if: steps.signing.outputs.available == 'true'
        id: apk
        env:
          STA_RELEASE_STORE_PASSWORD: ${{ secrets.STA_RELEASE_STORE_PASSWORD }}
          STA_RELEASE_KEY_ALIAS: ${{ secrets.STA_RELEASE_KEY_ALIAS }}
          STA_RELEASE_KEY_PASSWORD: ${{ secrets.STA_RELEASE_KEY_PASSWORD }}
        run: |
          release_apk="app/build/outputs/apk/release/app-release.apk"
          output_dir="$RUNNER_TEMP/apks"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ! -f "$release_apk" ]]; then
            echo "::error::未找到 Release APK。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          mkdir -p "$output_dir"
          # 用发布证书重签，显式固定为 V3：
          # apksig 按 APK 的 minSdkVersion 挑选"有验证价值"的方案（实测 minSdk 21
          # 的包默认签出 V1+V2+V3，minSdk 34 的包只签 V3）。V1 服务 API<24、
          # V2 服务 API 24-27，对 minSdk 34 的 Sta 都没有验证场景；V4 是服务于
          # 增量安装的独立 .idsig 文件、不嵌入 APK。
          zipalign_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name zipalign | sort -V | tail -n 1)"
          if [[ -z "$zipalign_path" ]]; then
            echo "::error::未找到 zipalign。"
            exit 1
          fi
          "$zipalign_path" -p -f 4 "$release_apk" "$output_dir/app-release-aligned.apk"
          "$apksigner_path" sign \
            --ks "$RUNNER_TEMP/sta-release.jks" \
            --ks-pass "pass:$STA_RELEASE_STORE_PASSWORD" \
            --ks-key-alias "$STA_RELEASE_KEY_ALIAS" \
            --key-pass "pass:$STA_RELEASE_KEY_PASSWORD" \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --out "$output_dir/app-release.apk" \
            "$output_dir/app-release-aligned.apk"
          "$apksigner_path" verify -v --print-certs "$output_dir/app-release.apk"
          echo "release_path=$output_dir/app-release.apk" >> "$GITHUB_OUTPUT"

      - name: 上传 Release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
